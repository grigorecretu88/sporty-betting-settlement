spring:
  profiles:
    default: mock
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
    producer:
      properties:
        max.block.ms: 5000
    listener:
      missing-topics-fatal: false
      ack-mode: record

logging:
  level:
    root: INFO

app:
  rocketmq:
    topics:
      bet-settlements: bet-settlements
    consumer:
      group: sporty-settlement-consumer
  kafka:
    publish-timeout: 5s
    consumer:
      group: settlement-group
      retry-interval: 250ms
      max-retries: 2
      dlt-publish-timeout: 5s
    topics:
      event-outcomes: event-outcomes
